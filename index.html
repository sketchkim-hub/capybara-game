<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>카피바라 키우기</title><style>
*{box-sizing:border-box;margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
html,body{height:100%;overflow:hidden;background:#fdf3e3}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;background:linear-gradient(#fffaf2ee,#fffaf200)}
#name{font-weight:800;font-size:18px;color:#6b4423}#stage{font-size:12px;background:#ffb74d;color:#fff;border-radius:10px;padding:2px 8px;margin-left:6px}
#coin{float:right;font-weight:700;color:#b8860b}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:8px;font-size:11px;color:#6b4423}
.bar{height:7px;background:#eadbc8;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:#8bc34a;transition:.4s}
#exp{margin-top:6px;font-size:11px;color:#8d6e63}
#acts{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 10px calc(env(safe-area-inset-bottom) + 12px);background:#fffaf2ee;border-radius:20px 20px 0 0;box-shadow:0 -4px 16px #0001}
#acts button{border:0;background:#fff3e0;border-radius:14px;padding:8px 0;font-size:12px;color:#6b4423;font-weight:700}
#acts button b{display:block;font-size:24px}
#acts button:active{transform:scale(.94)}
#toast{position:fixed;top:38%;left:50%;transform:translateX(-50%);background:#6b4423e0;color:#fff;padding:10px 16px;border-radius:16px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.modal{position:fixed;inset:0;z-index:10;background:#0006;display:none;align-items:center;justify-content:center}
.modal.on{display:flex}.box{background:#fffaf2;border-radius:20px;padding:20px;width:86%;max-width:360px;text-align:center;color:#6b4423}
.box h2{margin-bottom:10px}.box input{width:100%;padding:12px;border-radius:12px;border:2px solid #ffcc80;font-size:16px;margin:10px 0}
.box .btn{border:0;background:#ff9800;color:#fff;font-weight:800;padding:12px;border-radius:12px;width:100%;font-size:15px;margin-top:6px}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.shop button{border:2px solid #ffe0b2;background:#fff;border-radius:12px;padding:10px 4px;font-size:13px;color:#6b4423}
.shop button.own{background:#dcedc8;border-color:#aed581}
#gameBtn{position:fixed;right:12px;top:42%;width:64px;height:64px;border-radius:20px;border:0;background:linear-gradient(#ffb74d,#ff8a00);color:#fff;font-size:30px;box-shadow:0 4px 12px #0003;z-index:5}
#gameBtn span{display:block;font-size:11px;font-weight:800;margin-top:-4px}
.gm{display:block;width:100%;border:2px solid #ffe0b2;background:#fff;border-radius:14px;padding:12px;margin:8px 0;font-size:15px;color:#6b4423;font-weight:700;text-align:left}
.gm small{display:block;font-weight:400;color:#a1887f;font-size:12px}
#mg{position:fixed;inset:0;background:#e8f5e9;display:none;z-index:20;touch-action:none}#mg.on{display:block}
#mgc{position:absolute;inset:0;width:100%;height:100%}
#mgTop{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 12px;display:flex;justify-content:space-between;align-items:center;color:#6b4423;font-weight:800}
#mgBack{border:0;background:#fff;border-radius:12px;padding:8px 12px;font-weight:800;color:#6b4423;box-shadow:0 2px 6px #0002}
#mgEnd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0005}#mgEnd.on{display:flex}
#diffM .diff{display:grid;gap:8px;margin:12px 0}
#diffM .diff button{border:2px solid #ffe0b2;background:#fff;border-radius:14px;padding:12px;font-size:15px;font-weight:800;color:#6b4423;text-align:left}
#diffM .diff button small{display:block;font-weight:500;color:#a1887f;font-size:12px;margin-top:2px}
#diffM .diff button.sel{border-color:#ff9800;background:#fff3e0;box-shadow:0 0 0 2px #ffcc80}
</style></head><body>
<canvas id="c"></canvas>
<div id="top"><span id="name">카피바라</span><span id="stage">아기</span><span id="coin">🪙 0</span>
<div class="bars" id="bars"></div><div id="exp"></div></div>
<div id="toast"></div>
<div id="acts">
<button data-a="feed"><b>🍉</b>먹이</button><button data-a="walk"><b>🌳</b>산책</button><button data-a="exercise"><b>🏃</b>운동</button><button data-a="play"><b>🧶</b>놀이</button>
<button data-a="study"><b>📚</b>공부</button><button data-a="trick"><b>🎵</b>재롱</button><button data-a="decor"><b>🏠</b>집꾸미기</button><button data-a="sleep"><b>💤</b>잠자기</button></div>
<div class="modal" id="nameM"><div class="box"><h2>🦫 아기 카피바라가 태어났어요!</h2><p>이름을 지어 주세요</p><input id="nameI" maxlength="8" placeholder="예: 바라, 유자, 뭉치"><button class="btn" id="nameB">이름 정하기</button></div></div>
<div class="modal" id="decorM"><div class="box"><h2>🏠 집 꾸미기</h2><p>코인으로 가구를 사서 집을 꾸며요</p><div class="shop" id="shop"></div><button class="btn" id="decorX">닫기</button></div></div>
<div class="modal" id="diffM"><div class="box"><h2>🏃 운동 난이도</h2><p style="font-size:13px">난이도가 높을수록 빠르고, 보상도 커요</p>
<div class="diff" id="diffList">
<button type="button" data-d="easy">🌱 쉬움<small>느린 노트 · 넓은 판정 · 보상 ×0.85</small></button>
<button type="button" data-d="normal" class="sel">⭐ 보통<small>기본 속도 · 기본 판정 · 보상 ×1.0</small></button>
<button type="button" data-d="hard">🔥 어려움<small>빠른 노트 · 좁은 판정 · 보상 ×1.25</small></button>
<button type="button" data-d="veryhard">💀 매우어려움<small>매우 빠름 · 아주 좁은 판정 · 보상 ×1.5</small></button>
</div>
<button class="btn" id="diffGo">시작!</button>
<button class="btn" id="diffX" style="background:#8d6e63;margin-top:8px">취소</button></div></div>
<script type="module" src="game.js"></script><button id="gameBtn" aria-label="미니게임">🎮<span>미니게임</span></button>
<div class="modal" id="menuM"><div class="box"><h2>🎮 미니게임</h2><p style="font-size:13px">한 판에 체력 5 · 점수만큼 코인·경험치·행복!</p>
<button class="gm" data-g="jump">🦘 장애물 뛰어넘기<small>화면을 탭해서 점프! 돌멩이를 넘어요 · 최고 <b id="b_jump">0</b></small></button>
<button class="gm" data-g="dodge">☔ 장애물 피하기<small>좌우로 터치해서 떨어지는 돌을 피해요 · 최고 <b id="b_dodge">0</b></small></button>
<button class="gm" data-g="catch">🍊 유자 받기<small>좌우로 움직여 유자를 받아요 (돌은 조심!) · 최고 <b id="b_catch">0</b></small></button>
<button class="btn" id="menuX">닫기</button></div></div>
<div id="mg"><canvas id="mgc"></canvas><div id="mgTop"><button id="mgBack">← 홈으로</button><span id="mgTitle"></span><span id="mgScore">0점</span></div>
<div id="mgEnd"><div class="box"><h2 id="endT">게임 끝!</h2><p id="endP"></p><button class="btn" id="again">다시 하기</button><button class="btn" id="endHome" style="background:#8d6e63">홈으로</button></div></div></div>
<script type="module" src="games.js"></script></body></html>
